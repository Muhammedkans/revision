<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-container">
        <h1>My Tasks</h1>
        
        <!-- Input section for adding new todos -->
        <div class="input-section">
            <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off">
            <button id="add-btn">Add Task</button>
        </div>

        <!-- Filters section -->
        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <!-- The List where todos will be displayed -->
        <ul id="todo-list">
            <!-- Items will be generated by JavaScript here -->
        </ul>

        <!-- Footer with stats and actions -->
        <div class="todo-footer">
            <span id="items-left">0 items left</span>
            <button id="clear-completed-btn">Clear Completed</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
